[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cudaquant"
version = "0.1.0"
description = "GPU-accelerated quantitative trading research platform for NVIDIA Jetson Orin"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "CUDAQuant Team" }
]
keywords = ["quantitative", "trading", "CUDA", "GPU", "Jetson", "backtesting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core / API
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",

    # Data / storage
    "numpy>=1.24",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "duckdb>=0.9",
    "pyyaml>=6.0",
    "msgpack>=1.0",

    # ML (CPU baseline; GPU via PyTorch/CuPy when available)
    "scikit-learn>=1.3",
    "scipy>=1.11",

    # Async / streaming
    "httpx>=0.25",
    "websockets>=12.0",
    "aiokafka>=0.10; python_version >= '3.10'",

    # UI
    "jinja2>=3.1",

    # Utilities
    "structlog>=24.1",
    "click>=8.1",
    "rich>=13.7",
    "psutil>=5.9",
]

[project.optional-dependencies]
alpaca = [
    "alpaca-py>=0.20",
]
gpu = [
    "cupy-cuda11x>=12.0; platform_machine == 'aarch64'",
    "torch>=2.1; platform_machine == 'aarch64'",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-timeout>=2.2",
    "ruff>=0.2",
    "mypy>=1.8",
    "httpx>=0.25",
]
llm = [
    "openai>=1.10",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
]

[project.scripts]
cudaquant = "cudaquant.cli:main"

[tool.setuptools.packages.find]
include = ["cudaquant*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
timeout = 300
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring GPU (deselect with '-m \"not gpu\"')",
    "jetson: marks tests requiring Jetson hardware",
    "integration: marks integration tests",
    "synthetic: marks tests using synthetic data only",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["build/", "dist/", ".venv/"]
